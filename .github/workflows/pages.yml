name: 웹앱 배포

# app/ 폴더만 올린다. source/ 의 원본 안내서와 tools/ 는 웹으로 나가지 않는다.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 판 번호를 두 자리에 같은 값으로 박는다.
      #   assets/version.js  — 코드와 함께 캐시된다(옛 탭이면 옛 번호가 남는다)
      #   data/build.json    — 화면이 캐시를 건너뛰고 받아 온다(늘 새 번호)
      # 둘이 어긋나면 그 탭이 옛 코드를 돌리고 있다는 뜻이라 화면이 띠를 띄운다.
      # 이 도구는 빌드 과정이 없어 주소가 늘 같으므로, 이 장치가 없으면 새 판을
      # 올려도 열어 둔 탭은 옛 코드로 계속 hwpx를 만든다.
      - name: 판 번호 박기
        run: |
          set -eu
          V="$(git rev-parse --short=12 HEAD)"
          printf '{"build":"%s"}\n' "$V" > app/data/build.json
          sed -i "s/^export const BUILD = '[^']*';/export const BUILD = '$V';/" app/assets/version.js
          grep -q "export const BUILD = '$V';" app/assets/version.js \
            || { echo "version.js 에 판 번호를 박지 못했다"; exit 1; }
          echo "판 번호 $V"
          cat app/data/build.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: pages
        uses: actions/deploy-pages@v4
